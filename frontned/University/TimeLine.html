  <div class="breadcrumb">
    <h2 class="report">Time Line</h2>  
</div>
    

    
    <div class="container">
        <form id="appraisalForm">
            <label for="start-time">Set Start Time:</label>
            <input type="datetime-local" id="start-time" name="start-time" required>

            <label for="end-time">Set End Time:</label>
            <input type="datetime-local" id="end-time" name="end-time" required>

            <button type="button" onclick="startAppraisal()">Start Appraisal Process</button>
            <button type="button" onclick="endAppraisal()">End Appraisal Process</button>
        </form>
        <div class="message" id="message"></div>
    </div>

        <script>
         function startAppraisal() {
            const startTime = document.getElementById('start-time').value;
            const message = document.getElementById('message');

            if (startTime) {
                message.textContent = `Appraisal process started at ${new Date(startTime).toLocaleString()}.`;
                message.className = "message success";
            } else {
                message.textContent = 'Please set a valid start time.';
                message.className = "message error";
            }
        }

        function endAppraisal() {
            const endTime = document.getElementById('end-time').value;
            const message = document.getElementById('message');

            if (endTime) {
                message.textContent = `Appraisal process ended at ${new Date(endTime).toLocaleString()}.`;
                message.className = "message success";
            } else {
                message.textContent = 'Please set a valid end time.';
                message.className = "message error";
            }
        }
    </script>
</body>
</html>
