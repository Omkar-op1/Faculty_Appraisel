<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previous Year Appraisals</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a73e8;
            --secondary-color: #4285f4;
            --text-primary: #202124;
            --text-secondary: #5f6368;
            --background-light: #f8f9fa;
            --border-color: #dadce0;
            --success-color: #0f9d58;
            --pending-color: #f4b400;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-light);
            color: var(--text-primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background-color: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 24px;
            font-weight: 500;
        }

        .filters-section {
            background-color: white;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
            margin-bottom: 24px;
        }

        .filter-select {
            padding: 8px 16px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            margin-right: 12px;
            font-size: 14px;
            color: var(--text-primary);
            background-color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-select:hover {
            border-color: var(--primary-color);
        }

        .appraisal-card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
            margin-bottom: 16px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .appraisal-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(60,64,67,0.2);
        }

        .appraisal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .appraisal-year {
            font-size: 18px;
            font-weight: 500;
            color: var(--primary-color);
        }

        .appraisal-details {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 4px;
        }

        .detail-value {
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 500;
        }

        .status {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 500;
        }

        .status.completed {
            background-color: rgba(15, 157, 88, 0.1);
            color: var(--success-color);
        }

        .status.pending {
            background-color: rgba(244, 180, 0, 0.1);
            color: var(--pending-color);
        }

        .status i {
            margin-right: 6px;
            font-size: 12px;
        }

        .view-details-btn {
            padding: 8px 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }

        .view-details-btn:hover {
            background-color: var(--secondary-color);
        }

        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }

            .header {
                flex-direction: column;
                text-align: center;
            }

            .filters-section {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .filter-select {
                margin-right: 0;
                width: 100%;
            }

            .appraisal-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Previous Year Appraisals</h1>
            <button class="view-details-btn" onclick="exportAppraisals()">
                <i class="fas fa-download"></i> Export
            </button>
        </div>

        <div class="filters-section">
            <select class="filter-select" onchange="filterAppraisals()">
                <option value="">All Years</option>
                <option value="2023">2023</option>
                <option value="2022">2022</option>
                <option value="2021">2021</option>
            </select>
            <select class="filter-select" onchange="filterAppraisals()">
                <option value="">All Status</option>
                <option value="completed">Completed</option>
                <option value="pending">Pending</option>
            </select>
        </div>

        <div class="appraisal-card">
            <div class="appraisal-header">
                <div class="appraisal-year">2023 Annual Performance Review</div>
                <button class="view-details-btn" onclick="viewDetails(2023)">View Details</button>
            </div>
            <div class="appraisal-details">
                <div class="detail-item">
                    <div class="detail-label">Review Period</div>
                    <div class="detail-value">Jan 2023 - Dec 2023</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Overall Rating</div>
                    <div class="detail-value">4.5/5.0</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Manager</div>
                    <div class="detail-value">John Smith</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Status</div>
                    <div class="detail-value">
                        <span class="status completed">
                            <i class="fas fa-check-circle"></i>Completed
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Additional cards can be added here -->
    </div>

    <script>
        function filterAppraisals() {
            // Implement filtering logic
            console.log('Filtering appraisals...');
        }

        function viewDetails(year) {
            // Implement view details logic
            console.log('Viewing details for year:', year);
        }

        function exportAppraisals() {
            // Implement export logic
            console.log('Exporting appraisals...');
        }
    </script>
</body>
</html>
