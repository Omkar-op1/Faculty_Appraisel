<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Profile System - Government of NCT Delhi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
     <link rel="stylesheet" href="HODProfile.css">
</head>
<body>
   
    <header class="header">
        <div class="header-content">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="50 50 100 100" class="emblem">
            <!-- Adjusted viewBox for larger icon fit -->
            <!-- Document Icon with Border -->
            <path d="M70 75 
                     L130 75 
                     Q135 75 135 80
                     L135 130
                     Q135 135 130 135
                     L70 135
                     Q65 135 65 130
                     L65 80
                     Q65 75 70 75Z" 
                  fill="#FFFFFF"
                  stroke="#27AE60"
                  stroke-width="3"
                  opacity="0.95" />
            <!-- Lines -->
            <g fill="#27AE60" opacity="0.7">
              <rect x="75" y="90" width="40" height="2" rx="1" />
              <rect x="75" y="100" width="50" height="2" rx="1" />
              <rect x="75" y="110" width="45" height="2" rx="1" />
            </g>
            <!-- Check Mark -->
            <path d="M75 118 
                     L85 128 
                     L110 103" 
                  stroke="#27AE60" 
                  stroke-width="4" 
                  fill="none" 
                  stroke-linecap="round" 
                  stroke-linejoin="round" />
          </svg>
          <div class="header-text">
            <h1>Faculty Appraisal System</h1>
          </div>
        </div>
      </header>

  
   <nav class="navigation">
    <div class="nav-content">
       <ul class="nav-links">
               <li><a href="HodHomepag.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="HODProfile.html"class="active" ><i class="fas fa-user"></i> Profile</a></li>
                <li><a href="ManageFacultyHOD.html"><i class="fas fa-file-alt"></i> Manage Faculty</a></li>
                <li><a href="HODEndorse.html"><i class="fas fa-chart-bar"></i>Endorse</a></li>
                <li><a href="FacultyToHOD.html"><i class="fas fa-chart-bar"></i> Report</a></li>
      </ul>  
      <div class="user-section">
            <div class="profile-container">
              <div class="profile-info">
                
                <img src="profile.png" alt="Profile" class="profile-icon">
                <span class="profile-name"></span>
                <i class="fas fa-chevron-down dropdown-icon"></i>
              </div>
              
              <div class="profile-dropdown hidden">
                <ul>
                  <li><a href="#"><i class="fas fa-user"></i> View Profile</a></li>
                  <li><a href="setting.html"><i class="fas fa-cog"></i> Settings</a></li>
                  <li class="logout" id="logoutbutton"><a href="#"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                </ul>
              </div>
            </div>
            
            <div class="notification-bell">
              <i class="fas fa-bell"></i>
              <span class="notification-badge">3</span>
            </div>
          </div>   
    </div>
  </nav>
  
  <div class="breadcrumb">
    <h2 class="report">Manage Faculty</h2>  
</div>
    

    
    <main class="main-content">
        <form class="profile-form" id="facultyProfileForm">
            
            <div class="form-section">
                <h3 class="section-title"><i class="fas fa-user-circle"></i> Personal Information</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="title" class="required">Title</label>
                        
                    </div>
                    <div class="form-group">
                        <label for="firstName" class="required">First Name</label>
                        
                    </div>
                    <div class="form-group">
                        <label for="middleName">Middle Name</label>
                        
                    </div>
                    <div class="form-group">
                        <label for="lastName" class="required">Last Name</label>
                        
                    </div>
                </div>
            </div>

            
            <div class="form-section">
                <h3 class="section-title"><i class="fas fa-address-card"></i> Contact Information</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="phone" class="required">Phone</label>
                        
                    </div>
                    <div class="form-group">
                        <label for="email" class="required">Email</label>
                        
                    </div>
                    <div class="form-group">
                        <label for="gender" class="required">Gender</label>
                        
                    </div>
                    <div class="form-group">
                        <label for="dob" class="required">Date of Birth</label>
                        
                    </div>
                </div>
            </div>

            
            <div class="form-section">
                <h3 class="section-title"><i class="fas fa-map-marker-alt"></i> Address Details</h3>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="address1" class="required">Address Line 1</label>
                        
                    </div>
                    <div class="form-group full-width">
                        <label for="address2">Address Line 2</label>
                        
                    </div>
                    <div class="form-group">
                        <label for="city" class="required">City</label>
                        
                    </div>
                    <div class="form-group">
                        <label for="zipCode" class="required">PIN Code</label>
                        
                    </div>
                    <div class="form-group">
                        <label for="state" class="required">State</label>
                        
                        
                    </div>
                    <div class="form-group">
                        <label for="country" class="required">Country</label>
                        
                    </div>
                </div>
            </div>

            
            <div class="form-section">
                <h3 class="section-title"><i class="fas fa-briefcase"></i> Professional Information</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="designation" class="required">Designation</label>
                        
                    </div>
                    <div class="form-group">
                        <label for="department" class="required">Department</label>
                        
                    </div>
                    <div class="form-group">
                        <label for="education" class="required">Educational Qualifications</label>
                        
                    </div>
                    <div class="form-group">
                        <label for="specialization" class="required">Areas of Specialization</label>
                        
                    </div>
                    <div class="form-group">
                        <label for="experience" class="required">Experience</label>
                        
                    </div>
                    <div class="form-group">
                        <label for="employeeType" class="required">Employee Type</label>
                        
                    </div>
                </div>
            </div>

            
            <div class="form-actions">
                <button type="button" class="btn btn-draft" id="saveAsDraft">
                    <i class="fas fa-save"></i> Save As Draft
                </button>
                <button type="submit" class="btn btn-submit">
                    <i class="fas fa-paper-plane"></i> Submit
                </button>
            </div>
        </form>
    </main>

    <script src="HODProfile.js"></script>
</body>
</html>
